<linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6A45C" stop-opacity="1"/><stop offset="1" stop-color="#C6A45C" stop-opacity=".05"/></linearGradient>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/><rect width="1600" height="1200" fill="url(#glow)"/>
