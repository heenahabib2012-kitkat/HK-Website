<section class="cta-band" aria-labelledby="cta-title">
  <div class="cta-band__art media" {{media cta}} data-parallax="0.12" aria-hidden="true"></div>
  <div class="container cta-band__inner">
    <p class="eyebrow reveal">Start a conversation</p>
    <h2 id="cta-title" class="display reveal-words">Let’s Build What’s Next.</h2>
    <p class="lede reveal">Whether you are entering the UAE, expanding an existing business or exploring a new opportunity, let’s start the conversation.</p>
    <div class="btn-row reveal">
      <a class="btn btn--gold" href="contact.html">Start a Conversation</a>
      <a class="btn btn--line-light" href="mailto:{{config.email}}">{{config.email}}</a>
    </div>
  </div>
</section>
